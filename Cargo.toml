[package]
name = "pka-lab-inspector"
version = "0.2.2"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1"
pktfile = "=0.2.2"
quick-xml = "0.41"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.33", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "x11", "wayland"] }
rfd = "0.15"
csv = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
pktfile = { path = "vendor/pktfile" }


