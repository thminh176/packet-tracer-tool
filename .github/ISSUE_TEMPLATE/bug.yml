name: Bug report
description: Report a reproducible inspector problem
body:
  - type: markdown
    attributes:
      value: Do not attach private activities, courseware, answer keys, credentials or decoded XML.
  - type: textarea
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction with synthetic data and diagnostics
  - type: input
    attributes:
      label: App version and Windows version
