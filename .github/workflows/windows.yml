name: Windows release checks
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --manifest-path vendor/pktfile/Cargo.toml --lib
      - run: ./scripts/build-release.ps1 -SkipChecks
      - uses: actions/upload-artifact@v4
        with:
          name: PKA-Lab-Inspector-Windows-x86_64
          path: |
            dist/PKA-Lab-Inspector-Windows-x86_64.zip
            dist/PKA-Lab-Inspector/pka-lab-inspector.exe
